<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | KinoBot Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', path='admin.css') }}?v=4">
    <link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}">
    <meta name="theme-color" content="#0a0e17">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-modal">
            <h2><i class="ti ti-movie" style="color: var(--brand);"></i> KinoBot</h2>
            <p class="subtitle">Панель администратора</p>
            <form class="login-form" method="POST" action="/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">
                <input type="text" name="username" placeholder="Логин" required autocomplete="username">
                <input type="password" name="password" placeholder="Пароль" required autocomplete="current-password">
                <button type="submit"><i class="ti ti-login"></i> Войти</button>
            </form>
            {% if error %}
            <p class="error-message">{{ error }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
